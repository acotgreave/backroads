<style>
/* VOICE: a friendly night drive across America; short lines, one job per screen.
   IDEA: each day is a named American road; rare answers drive you further and spot rarer wildlife.
   PICTURE: a parallax night scene with your car, a route strip of landmarks, and a yellow wildlife-crossing sign that spins to reveal each answer.
   COLOUR and TYPE: night asphalt ground, lane yellow, sign green, interstate red/blue; Overpass (highway lettering). Night palette in both themes.
   LAYOUT: compact header, scene, route strip, one card at a time; stacks on phones. */
:root{--bg:#101318;--card:#181c23;--card2:#20252e;--ink:#f1ece2;--ink2:#a9a395;--line:#2b313c;--lane:#f2c230;--green:#0d6b3e;--red:#c8102e;--blue:#2c5fc4}
*{box-sizing:border-box;min-width:0}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Overpass,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,p{margin:0}
button,input{font:inherit}
a{color:var(--ink2)}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,12px)}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
header svg{width:30px;height:32px;flex:none}
header h1{font-size:22px;font-weight:900;letter-spacing:.01em}
header .tag{color:var(--ink2);font-size:13px}
.modes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:5px 12px;min-height:34px;font-size:13px;font-weight:800;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* scene */
.scene{position:relative;height:150px;border-radius:10px;overflow:hidden;background:linear-gradient(#0a1226,#1b1f3a 55%,#3a2638);border:1px solid var(--line)}
.scene .l{position:absolute;left:0;right:0;background-repeat:repeat-x}
.stars{inset:0;opacity:.8}
.moon{position:absolute;right:34%;top:14px;width:22px;height:22px;border-radius:50%;background:#f4ecd2;box-shadow:0 0 18px 4px rgba(244,236,210,.35)}
.far{bottom:44px;height:70px;background-size:auto 70px}
.mid{bottom:44px;height:80px;background-size:auto 80px}
.road{bottom:0;height:46px;background:#24272d}
.dash{bottom:20px;height:4px;background-image:repeating-linear-gradient(90deg,var(--lane) 0 22px,transparent 22px 48px)}
.car{position:absolute;left:18%;bottom:12px;width:76px;height:40px}
.car .wheel{transform-box:fill-box;transform-origin:center}
.scene.go .car{animation:bob .35s ease-in-out infinite}
.scene.go .wheel{animation:spin .4s linear infinite}
.beam{position:absolute;left:calc(18% + 70px);bottom:14px;width:140px;height:34px;background:linear-gradient(90deg,rgba(255,236,170,.35),transparent);clip-path:polygon(0 40%,100% 0,100% 100%,0 70%)}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.odo{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-weight:900;font-variant-numeric:tabular-nums;font-size:18px}
.odo small{font-size:11px;font-weight:600;color:var(--ink2);margin-left:3px}
/* route */
.route{position:relative;margin:10px 14px 4px;height:58px}
.route .track{position:absolute;left:0;right:0;top:27px;height:4px;border-radius:2px;background:var(--line)}
.route .fill{position:absolute;left:0;top:27px;height:4px;border-radius:2px;background:var(--lane);width:0;transition:width .2s linear}
.st{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--ink2);white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.st i{width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.st.up{bottom:24px}.st.up i{margin-top:3px}
.st.dn{top:24px;flex-direction:column-reverse}.st.dn i{margin-bottom:3px}
.st.hit{color:var(--ink)}.st.hit i{border-color:var(--lane);background:var(--lane)}
.st.first{transform:translateX(-5px);align-items:flex-start}
.st.last{transform:translateX(calc(-100% + 5px));align-items:flex-end}
.marker{position:absolute;top:22px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--red);border:2px solid #fff;transition:left .2s linear;z-index:2}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:10px 0 18px;min-height:250px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
.sign{background:var(--green);border:2px solid #fff;outline:2px solid var(--green);border-radius:8px;padding:14px 16px;margin:10px 0 4px;text-align:center}
.sign .cat{font-size:12px;opacity:.8}
.sign h2{font-size:clamp(19px,3.4vw,25px);font-weight:800;line-height:1.15;margin-top:2px;color:#fff}
.sign .rule{font-size:13px;opacity:.85;margin-top:2px;color:#fff}
.timer{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:var(--lane);width:100%}
.timer.low i{background:var(--red)}
form{display:flex;gap:6px}
form input{flex:1;font-size:17px;padding:9px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);font-weight:800;cursor:pointer;background:transparent;color:var(--ink);font-size:15px}
.btn.go{background:var(--lane);border-color:var(--lane);color:#14161b}
.btn:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--lane);outline-offset:2px}
.msg{min-height:20px;margin-top:6px;color:var(--ink2);font-size:13px}
/* reveal */
.reveal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin-top:12px}
.xing{width:118px;height:118px;perspective:500px}
.diamond{width:100%;height:100%;transition:transform .12s ease-in}
.diamond.flip{transform:rotateY(90deg)}
.diamond.land{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.rv .ans{font-size:19px;font-weight:800;opacity:0;transform:translateY(6px);transition:.35s}
.rv .animal{font-size:13px;color:var(--ink2);opacity:0;transition:.35s .1s}
.rv .mi{font-size:34px;font-weight:900;color:var(--lane);font-variant-numeric:tabular-nums;line-height:1.1;opacity:0;transition:.3s}
.rv.show .ans,.rv.show .animal,.rv.show .mi{opacity:1;transform:none}
.rv .alt{font-size:13px;color:var(--ink2);margin-top:4px;opacity:0;transition:.4s .3s}
.rv.show .alt{opacity:1}
.ladder{display:flex;gap:4px;margin-top:8px}
.ladder i{flex:1;height:5px;border-radius:2px;background:var(--line);transition:background .1s}
.next{margin-top:14px;display:flex;justify-content:flex-end;opacity:0;transition:.3s}
.next.on{opacity:1}
/* intro + end */
.intro h2{font-size:24px;font-weight:900;margin:6px 0 2px}
.intro p{color:var(--ink2)}
.zoo{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.zoo span{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;color:var(--ink2)}
.zoo svg{width:24px;height:24px}
.big{font-size:44px;font-weight:900;line-height:1;margin:6px 0 2px;color:var(--lane);font-variant-numeric:tabular-nums}
.res{list-style:none;padding:0;margin:12px 0;display:grid;gap:4px}
.res li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;background:var(--card2);border-radius:6px;font-size:14px}
.res li small{display:block;color:var(--ink2);font-size:12px}
.res li b{font-variant-numeric:tabular-nums}
.res svg{width:28px;height:28px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
pre.share{background:var(--card2);padding:10px;border-radius:6px;white-space:pre-wrap;font:13px/1.4 Overpass,sans-serif;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.stats div{background:var(--card2);border-radius:6px;padding:8px 10px}
.stats b{display:block;font-size:22px;font-weight:900;color:var(--lane);font-variant-numeric:tabular-nums;line-height:1.1}
.stats small{color:var(--ink2);font-size:12px}
.log h3{font-size:14px;font-weight:800;margin:14px 0 4px;color:var(--ink2);letter-spacing:.02em}
.trips li{grid-template-columns:minmax(0,1fr) auto}
.trips .em{letter-spacing:1px}
.souv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.souv span{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.souv svg{width:22px;height:22px}
.streak{color:var(--ink2);font-size:13px;margin-top:2px}
footer{color:var(--ink2);font-size:12px;padding-bottom:24px}
@media(max-width:560px){.st.mstop:not(.nextup) span{display:none}.xing{width:96px;height:96px}.reveal{gap:12px}.scene{height:130px}.modes{margin-left:0}}
@media(prefers-reduced-motion:reduce){.scene.go .car,.scene.go .wheel{animation:none}}
</style>
</head>

// ---------- matching ----------
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/['’`.]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|jr|sr)\b/g,' ').replace(/\bst\b/g,'saint').replace(/\bmt\b/g,'mount').replace(/\s+/g,' ').trim();
function prep(p){
  if(p.ready)return p;
  const items=p.bank
    ?p.bank.map(([name,al,tier],i)=>({name,al:[name,...al].map(norm).filter(Boolean),rank:i,tier}))
    :p.list.split('|').map((e,i)=>{const [name,al]=e.split('=');return {name:name.trim(),al:[name,...(al?al.split(';'):[])].map(norm),rank:i}});
  if(p.people){const seen=new Set();for(const it of items){const last=it.al[0].split(' ').pop();if(last.length>2&&!seen.has(last)){it.al.push(last);seen.add(last)}else seen.add(last)}}
  const n=items.length;
  if(!p.bank)items.forEach(it=>{const q=it.rank/n;it.tier=CUTS.findIndex(c=>q<c)});
  p.items=items;p.trapMap=Object.fromEntries(Object.entries(p.traps||{}).map(([k,v])=>[norm(k),v]));p.ready=true;return p;
}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return d[b.length]}
function judge(p,raw){
  let s=norm(raw);if(!s)return null;
  for(const w of (p.strip||[]).map(norm))s=s.replace(new RegExp('\\b'+w+'\\b','g'),' ').replace(/\s+/g,' ').trim();
  if(p.trapMap[s])return {trap:p.trapMap[s]};
  let best=null,score=0;
  for(const it of p.items)for(const a of it.al){
    let sc=0;if(s===a)sc=1000+a.length;else if(a.length>=4&&(' '+s+' ').includes(' '+a+' '))sc=a.length;
    if(sc>score){score=sc;best=it}}
  if(best)return {it:best};
  let bd=9;for(const it of p.items)for(const a of it.al){const lim=a.length>=9?2:a.length>=5?1:0;const d=lev(s,a);if(d<=lim&&d<bd){bd=d;best=it}}
  return best?{it:best,fuzzy:true}:{miss:true};
}

function rng(seed){let h=1779033703^seed.length;for(const ch of seed){h=Math.imul(h^ch.charCodeAt(0),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}

$('stars').style.backgroundImage=svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100">${Array.from({length:26},(_,i)=>`<circle cx="${(i*73)%300}" cy="${(i*37)%90}" r="${i%5?0.8:1.4}" fill="#fff" opacity="${.4+(i%3)*.2}"/>`).join('')}</svg>`);
$('far').style.backgroundImage=svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="70" viewBox="0 0 640 70"><path d="M0 70V48l40-6 20-22h70l16 20 60 4 30-18 40 2 14 16 90 4 20-26h80l18 24 50 2 30-14 32 6v38z" fill="#232741"/></svg>`);
$('mid').style.backgroundImage=svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="80" viewBox="0 0 420 80"><g fill="#0c0e13"><rect x="40" y="6" width="4" height="74"/><rect x="28" y="12" width="28" height="3"/><path d="M0 78h420v2H0z"/><path d="M150 80V48c0-4 6-4 6 0v8h4V40c0-6 8-6 8 0v40zm28 0V60c0-3 5-3 5 0v20z"/><rect x="250" y="6" width="4" height="74"/><rect x="238" y="12" width="28" height="3"/><path d="M330 80V52c0-4 5-4 5 0v6h4V44c0-5 7-5 7 0v14h4v-6c0-4 5-4 5 0v28z"/></g><path d="M44 14Q147 30 250 14M44 18Q147 34 250 18" stroke="#0c0e13" fill="none" stroke-width="1"/></svg>`);
let off=0;
function paint(){$('far').style.backgroundPositionX=(-off*.15)+'px';$('mid').style.backgroundPositionX=(-off*.5)+'px';$('dash').style.backgroundPositionX=(-off*1.4)+'px';$('stars').style.backgroundPositionX=(-off*.03)+'px'}
function routeHTML(){
  const r=road(),last=r.stops.length-1;
  $('route').innerHTML=`<div class="track"></div><div class="fill" id="fill"></div><div class="marker" id="mk"></div>`+r.stops.map(([m,n],i)=>
    `<div class="st ${i%2?'dn':'up'} ${i===0?'first':i===last?'last':'mstop'}" data-m="${m}" style="left:${m/7}%"><span></span><i></i></div>`).join('');
  $('route').querySelectorAll('.st span').forEach((s,i)=>s.textContent=r.stops[i][1]);
  setPos(shown);
}
function setPos(m){
  const f=Math.min(1,m/700);$('fill').style.width=f*100+'%';$('mk').style.left=f*100+'%';$('odo').textContent=Math.round(m);
  let nx=null;document.querySelectorAll('.st').forEach(s=>{const hit=m>=+s.dataset.m;s.classList.toggle('hit',hit);s.classList.remove('nextup');if(!hit&&!nx)nx=s});
  if(nx)nx.classList.add('nextup');
}
function drive(target,done){
  const from=shown,dist=target-from;
  if(dist<=0||calm){shown=target;setPos(target);done&&done();return}
  const dur=Math.min(2600,700+dist*16);$('scene').classList.add('go');const t0=performance.now();let last=t0;
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);off+=(now-last)*0.35*(1.2-k);last=now;shown=from+dist*e;setPos(shown);paint();
    if(k<1)requestAnimationFrame(step);else{$('scene').classList.remove('go');shown=target;setPos(target);done&&done()}};
  requestAnimationFrame(step);
}
// gentle idle cruise
(function idle(){if(!calm&&!$('scene').classList.contains('go')){off+=0.6;paint()}requestAnimationFrame(idle)})();

// ---------- screens ----------
function intro(){
  const r=road();
  card.innerHTML=`<div class="meta"><span>${mode==='daily'?'Daily drive #'+dayNo():'Unlimited drive'}</span><span>7 prompts · 25s each</span></div>
  <div class="intro"><h2></h2><p>${r.stops[0][1]} to ${r.stops[r.stops.length-1][1]}. Common answers barely move you. Rare ones cover real ground.</p></div>
  <div class="zoo">${ZOO.map((z,k)=>`<span>${sign(k,24)}${z.pts} mi</span>`).join('')}</div>
  <button class="btn go" id="start">Start ${mode==='daily'?'today’s':'this'} drive</button>`;
  card.querySelector('h2').textContent=r.name;
  $('start').onclick=ask;
}
function ask(){
  const p=getP(G.qs[G.i]);
  card.innerHTML=`<div class="meta"><span>${G.i+1} of 7</span><span>${road().name}</span></div>
  <div class="sign"><div class="cat"></div><h2></h2>${p.rule?'<div class="rule"></div>':''}</div>
  ${timerOn?'<div class="timer" id="tm"><i></i></div>':'<div style="height:10px"></div>'}
  <form id="f" autocomplete="off"><input id="in" aria-label="Your answer" placeholder="Your answer" autocapitalize="off" spellcheck="false"><button class="btn go">Go</button><button class="btn" type="button" id="pass">Pass</button></form>
  <div class="msg" id="msg"></div>`;
  card.querySelector('.cat').textContent=p.cat;card.querySelector('h2').textContent=p.q;if(p.rule)card.querySelector('.rule').textContent=p.rule;
  const inp=$('in');inp.focus({preventScroll:true});
  $('f').onsubmit=e=>{e.preventDefault();const r=judge(p,inp.value);if(!r)return;
    if(r.trap){$('msg').textContent=r.trap;inp.select();return}
    if(r.miss){$('msg').textContent='Not on the map. Try another.';inp.select();return}
    answer(p,r.it)};
  $('pass').onclick=()=>answer(p,null);
  if(timerOn){const t0=performance.now(),bar=$('tm');
    tick=setInterval(()=>{const left=SECS-(performance.now()-t0)/1000;bar.firstChild.style.width=Math.max(0,left/SECS*100)+'%';bar.classList.toggle('low',left<6);
      if(left<=0){clearInterval(tick);const r=judge(p,inp.value);answer(p,r&&r.it?r.it:null)}},100)}
}
function answer(p,it){
  clearInterval(tick);
  const k=it?it.tier:-1, pts=it?ZOO[k].pts:0;
  G.ans.push({q:p.q,a:it?it.name:'',pts,tier:k});G.i++;
  if(mode==='daily')store.set('day2',G);
  const rarer=p.items.filter(x=>x.tier===5&&(!it||x.name!==it.name)).sort(()=>Math.random()-.5).slice(0,2).map(x=>x.name);
  card.querySelector('#f').outerHTML=`<div class="reveal"><div class="xing"><div class="diamond" id="dm">${sign(0)}</div></div>
    <div class="rv" id="rv"><div class="mi" id="mi">+0 mi</div><div class="ans"></div><div class="animal"></div><div class="ladder" id="ld">${ZOO.map(()=>'<i></i>').join('')}</div><div class="alt"></div></div></div>
    <div class="next" id="nxw"><button class="btn go" id="nx">${G.i<7?'Next':'See your drive'}</button></div>`;
  $('msg').remove();const tm=$('tm');if(tm)tm.remove();
  const rv=$('rv');rv.querySelector('.ans').textContent=it?it.name:'No answer';
  rv.querySelector('.animal').textContent=it?'You spotted a '+ZOO[k].name.toLowerCase():'Nothing spotted this time';
  rv.querySelector('.alt').textContent=rarer.length?(k===5?'Also rare: ':'Rarer: ')+rarer.join(', '):'';
  const dm=$('dm'),lad=[...$('ld').children];
  const finish=()=>{dm.classList.add('land');rv.classList.add('show');
    const target=miles();const t0=performance.now();
    const miEl=$('mi');(function cnt(now){const e=Math.min(1,(now-t0)/600);if(!miEl.isConnected)return;miEl.textContent='+'+Math.round(pts*e)+' mi';if(e<1)requestAnimationFrame(cnt)})(t0);
    drive(target,()=>{$('nxw').classList.add('on');$('nx').focus({preventScroll:true})});};
  $('nx').onclick=()=>G.i<7?ask():end();
  // spin the sign up through the animals until it lands on this answer's
  const stops=k<0?[0,1,-1]:Array.from({length:k+1},(_,j)=>j);
  if(calm){dm.innerHTML=sign(k);lad.forEach((l,j)=>l.style.background=j<=k?'var(--lane)':'');finish();return}
  let j=0;
  (function flip(){const v=stops[j];dm.classList.add('flip');
    setTimeout(()=>{dm.innerHTML=sign(v);dm.classList.remove('flip');lad.forEach((l,x)=>l.style.background=x<=v&&v>=0?'var(--lane)':'');
      j++;if(j<stops.length)setTimeout(flip,90+j*45);else setTimeout(finish,120)},120)})();
}
function end(){
  if(mode==='daily'){store.set('day2',G);const h=store.get('hist',[]);if(!h.some(x=>x.date===G.date)){
    h.push({date:G.date,mi:miles(),road:road().name,tiers:G.ans.map(a=>a.tier),rare:G.ans.filter(a=>a.tier>=4).map(a=>[a.a,a.tier,a.q])});store.set('hist',h.slice(-400))}}
  const tl=trips();
  const mi=miles(),r=road();let at=r.stops[0][1];for(const [m,n] of r.stops)if(mi>=m)at=n;
  const share=`Backroads ${G.mode==='daily'?'#'+dayNo():'(unlimited)'} · ${r.name}\n${G.ans.map(a=>a.tier<0?'⬛':EMO[a.tier]).join('')} ${mi}/700 mi\n${URL_}`;
  card.innerHTML=`<div class="meta"><span>${r.name}</span><span>${G.mode==='daily'?'Daily #'+dayNo():'Unlimited'}</span></div>
  <div class="big">${mi} mi</div><p style="color:var(--ink2)">${mi>=700?'All the way to '+at+'.':'You made it to '+at+'.'}</p>
  ${G.mode==='daily'&&tl.streak?`<p class="streak">${tl.streak>1?tl.streak+' days on the road in a row.':'Day one on the road.'} ${mi>=tl.best&&tl.days>1?'Your furthest drive yet!':'Furthest drive: '+tl.best+' mi.'}</p>`:''}
  <ul class="res">${G.ans.map(a=>`<li>${sign(a.tier,28)}<div><span></span><small></small></div><b>${a.pts}</b></li>`).join('')}</ul>
  <pre class="share" id="sh"></pre>
  <div class="row"><button class="btn go" id="cp">Copy result</button><button class="btn" id="again">${G.mode==='daily'?'Play Unlimited':'Drive again'}</button><button class="btn" id="lg">Trip log</button></div>`;
  card.querySelectorAll('.res li').forEach((li,k)=>{li.querySelector('span').textContent=G.ans[k].a||'No answer';li.querySelector('small').textContent=G.ans[k].q});
  $('sh').textContent=share;
  $('cp').onclick=async e=>{try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({text:share});return}await navigator.clipboard.writeText(share);e.target.textContent='Copied'}catch(_){e.target.textContent='Select the text to copy'}};
  $('again').onclick=()=>setMode('free');$('lg').onclick=tripLog;
}
const EMO=['🐿️','🦝','🦌','🐺','🐻','🦅'];
function trips(){
  const h=store.get('hist',[]).slice().sort((a,b)=>a.date<b.date?-1:1),dates=new Set(h.map(x=>x.date));
  let streak=0;const d=new Date();if(!dates.has(today(d)))d.setDate(d.getDate()-1);
  while(dates.has(today(d))){streak++;d.setDate(d.getDate()-1)}
  let longest=0,run=0,prev=null;for(const x of h){const t=Date.parse(x.date);run=prev!==null&&t-prev===864e5?run+1:1;prev=t;longest=Math.max(longest,run)}
  const souv=new Map();for(const x of h)for(const [a,t,q] of x.rare||[])if(a&&(!souv.has(a)||souv.get(a).t<t))souv.set(a,{t,q,date:x.date});
  return {h,streak,longest,days:h.length,best:h.reduce((m,x)=>Math.max(m,x.mi),0),total:h.reduce((m,x)=>m+x.mi,0),souv:[...souv].map(([a,v])=>({a,...v})).sort((a,b)=>b.t-a.t||(a.date<b.date?1:-1))}
}
function tripLog(){
  clearInterval(tick);const t=trips();
  const fmt=s=>new Date(s+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  card.innerHTML=`<div class="meta"><span>Trip log</span><span>${t.days} daily drive${t.days===1?'':'s'}</span></div>
  <div class="log">${t.days?`<div class="stats"><div><b>${t.streak}</b><small>day streak (best ${t.longest})</small></div><div><b>${t.best}</b><small>mi, furthest drive</small></div><div><b>${t.total.toLocaleString('en-US')}</b><small>total miles</small></div></div>
  <h3>Souvenirs</h3>${t.souv.length?`<div class="souv">${t.souv.slice(0,40).map(()=>'<span></span>').join('')}</div>`:'<p class="streak">Spot a black bear or bald eagle (80 or 100 mi) to pick up a souvenir.</p>'}
  <h3>Past trips</h3><ul class="res trips">${t.h.slice().reverse().slice(0,60).map(x=>`<li><div><span></span><small></small></div><b>${x.mi} mi</b></li>`).join('')}</ul>`
  :'<p class="streak" style="margin:12px 0">No trips logged yet. Finish today’s daily drive and it’ll show up here.</p>'}</div>
  <div class="row"><button class="btn go" id="back">Back to the road</button></div>`;
  card.querySelectorAll('.souv span').forEach((el,i)=>{const s=t.souv[i];el.innerHTML=sign(s.t,22);el.append(s.a);el.title=s.q+' · '+fmt(s.date)});
  const rev=t.h.slice().reverse();
  card.querySelectorAll('.trips li').forEach((li,i)=>{const x=rev[i];li.querySelector('span').textContent=(x.road||'Daily drive')+' · '+fmt(x.date);
    li.querySelector('small').textContent=x.tiers?x.tiers.map(k=>k<0?'⬛':EMO[k]).join(''):'';li.querySelector('small').className='em'});
  $('back').onclick=start;
}
function start(){
  clearInterval(tick);
  const saved=mode==='daily'?store.get('day2',null):null;
  if(saved&&saved.date===today()&&saved.qs){G=saved;shown=miles();routeHTML();if(G.i>=7)end();else ask();return}
  G=newGame(mode==='daily'?'backroad-'+today():null);shown=0;routeHTML();intro();
}
function setMode(m){mode=m;$('mDaily').setAttribute('aria-pressed',m==='daily');$('mFree').setAttribute('aria-pressed',m==='free');start()}
$('mDaily').onclick=()=>setMode('daily');$('mFree').onclick=()=>setMode('free');
const tb=$('mTimer');const syncT=()=>{tb.setAttribute('aria-pressed',timerOn);tb.textContent=timerOn?'Timer on':'Timer off'};syncT();
tb.onclick=()=>{timerOn=!timerOn;store.set('timer',timerOn);syncT()};
$('mLog').onclick=tripLog;
if(typeof BANK_META!=='undefined')$('src').textContent=`Answers from Wikidata; rarity from Wikipedia page views (${BANK_META.window}), refreshed ${BANK_META.built}.`;
paint();start();
}
</script>
</body>
</html>
