<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Backroads: the US road-trip quiz</title>
<meta name="description" content="Seven all-American prompts a day. Common answers barely move you; the rarest right answer takes you furthest.">
<meta property="og:title" content="Backroads: the US road-trip quiz">
<meta property="og:description" content="Seven all-American prompts a day. The rarest right answer takes you furthest.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://backroads.howtospeakdata.com/">
<meta property="og:image" content="https://backroads.howtospeakdata.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly daytime road trip across America; short lines, one job per screen.
   IDEA: each day is a named American road drawn as a map; rare answers drive you further and the animal you spotted is planted where you stopped.
   PICTURE: a folded paper road atlas: cream paper, pictorial scenery, a red highway line, the trip marked in yellow highlighter;
     green guide signs for stops, green mile-marker posts for answers (with the animal you spotted), US route shields; results share as plain text (WhatsApp-friendly).
   COLOUR and TYPE: atlas paper, highlighter yellow, highway red, sign green, park brown, interstate red/blue; Overpass (highway lettering) + Bitter (slab, for prompts).
   LAYOUT: question on top, map in the middle, answer bar at the bottom, on every screen size. */
:root{--bg:#efe6cf;--panel:rgba(251,247,236,.97);--panel2:#efe7d2;--ink:#26231d;--ink2:#6b6253;--line:#d6c9aa;--lane:#ffd83a;--green:#00704a;--green2:#1b8a55;--brown:#6b4226;--red:#c8102e;--blue:#1d4f9c;--paper:#f4ecd6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Overpass,system-ui,sans-serif;overflow:hidden}
h1,h2,h3,p{margin:0}
button,input{font:inherit}
a{color:var(--ink2)}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--paper)}
/* atlas page folds and paper grain, laid over the map */
#folds{position:fixed;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply;
  background:
   linear-gradient(90deg,transparent 32.6%,rgba(120,95,50,.10) 33.2%,rgba(255,255,255,.0) 33.4%,rgba(120,95,50,.05) 33.7%,transparent 34.6%),
   linear-gradient(90deg,transparent 65.9%,rgba(120,95,50,.10) 66.5%,rgba(255,255,255,0) 66.7%,rgba(120,95,50,.05) 67%,transparent 67.9%),
   linear-gradient(180deg,transparent 48.6%,rgba(120,95,50,.09) 49.6%,rgba(255,255,255,0) 50%,rgba(120,95,50,.05) 50.4%,transparent 51.4%),
   radial-gradient(ellipse at center,transparent 60%,rgba(120,90,40,.16) 100%)}
#pins{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);background:var(--green);color:#fff;border:1.5px solid #fff;outline:1.5px solid var(--green);border-radius:5px;padding:1px 6px 0;text-align:center;font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;white-space:nowrap;box-shadow:0 2px 5px rgba(60,40,10,.35)}
.lbl small{display:block;font-size:9px;font-weight:600;letter-spacing:.02em;text-transform:none;opacity:.9}
.lbl.hit::before{content:'✓ ';color:#ffd83a}
.lbl.end{background:var(--blue);outline-color:var(--blue)}
.pin{position:absolute;width:34px;height:34px;transform:translate(-50%,-90%);filter:drop-shadow(0 2px 2px rgba(60,40,10,.45))}
#pins.far .pin{width:22px;height:22px}
.pin.new{animation:plant .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes plant{0%{transform:translate(-50%,-90%) scale(0)}100%{transform:translate(-50%,-90%) scale(1)}}
.car{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);z-index:3}
.car .badge{position:absolute;inset:6px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.6);display:grid;place-items:center}
.car .badge svg{width:22px;height:22px}
.car .ride{position:absolute;left:50%;bottom:34px;width:44px;height:44px;transform:translateX(-50%);opacity:0;transition:opacity .2s}
.car.riding .ride{opacity:1;animation:bob .35s ease-in-out infinite}
@keyframes bob{50%{margin-bottom:3px}}

/* chrome */
.top{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:10px max(14px,3vw) 0;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.odo{font-weight:900;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;background:#26231d;color:#fff;border-radius:6px;padding:4px 8px 2px;justify-self:start;box-shadow:0 2px 6px rgba(60,40,10,.3)}
.odo small{font-size:11px;letter-spacing:.12em;margin-left:4px;color:#cfc6b3}
.prog{display:flex;flex-direction:column;align-items:center;gap:3px}
.prog .slots{display:flex;gap:3px}
.prog .slots i{width:22px;height:22px;display:block}
.prog .slots i svg{width:100%;height:100%}
.prog .slots i.open{border:1.5px dashed rgba(38,35,29,.4);transform:scale(.62,.8);border-radius:3px;background:rgba(255,255,255,.5)}
.prog span{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink);text-shadow:0 0 3px #fff,0 0 6px #fff}
.guide{justify-self:end;background:var(--green);color:#fff;border:2px solid #fff;outline:2px solid var(--green);border-radius:6px;padding:3px 10px;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.guide:empty{display:none}
body.kb .top{display:none}
body.kb .card{top:8px;max-height:40vh}
.card{position:fixed;left:50%;transform:translateX(-50%);top:62px;width:min(600px,calc(100% - 24px));background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;z-index:4;box-shadow:0 8px 24px rgba(60,40,10,.25);max-height:calc(100% - 150px);overflow:auto}
.cat{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.q{font-family:Bitter,Georgia,serif;font-weight:700;font-size:clamp(18px,2.4vw,23px);line-height:1.15;margin-top:2px}
.rule{color:var(--ink2);font-size:14px;margin-top:2px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(600px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;z-index:4;box-shadow:0 8px 24px rgba(60,40,10,.25)}
.bar form{display:flex;gap:8px;flex:1;align-items:center}
.bar input{flex:1;font-size:17px;padding:8px 12px;min-height:44px;border:2px solid var(--blue);border-radius:9px;background:#fff;color:var(--ink)}
.btn{min-height:44px;padding:0 16px;border-radius:9px;border:2px solid var(--line);font-weight:800;cursor:pointer;background:transparent;color:var(--ink);font-size:16px;white-space:nowrap}
.btn.go{background:var(--blue);border-color:#fff;outline:2px solid var(--blue);color:#fff}
.btn.wide{flex:1}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.btn:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--lane);outline-offset:2px}
.ring{width:44px;height:44px;flex:none;position:relative;display:grid;place-items:center;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring.low{color:var(--red)}
.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);background:#26231de6;color:#fff;border-radius:999px;padding:4px 14px;font-size:14px;z-index:4;white-space:nowrap}
.msg:empty{display:none}

/* reveal */
.rv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.rv .xing{width:46px;height:46px;grid-row:span 2;perspective:400px}
.diamond{width:100%;height:100%;transition:transform .12s ease-in}
.diamond.flip{transform:rotateY(90deg)}
.rv .animal{font-family:Bitter,Georgia,serif;font-weight:700;font-size:clamp(19px,2.6vw,24px);line-height:1.05}
.rv .gain{color:#fff;background:var(--green);border:2px solid #fff;outline:2px solid var(--green);border-radius:6px;padding:1px 8px;font-weight:900;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rv .ans{grid-column:2/4;font-size:14px;color:var(--ink2)}
.rv .ans b{color:var(--ink)}
.stopban{display:flex;gap:10px;align-items:center;margin-top:8px;color:#fff;background:var(--green);border:2px solid #fff;outline:2px solid var(--green);border-radius:7px;padding:8px 12px}
.stopban b{display:block;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.stopban span{font-size:13px;opacity:.9}
.stopban svg{width:28px;height:28px;flex:none}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:6px}
.ladder div{display:flex;flex-direction:row;justify-content:center;gap:4px;align-items:center;border-radius:6px;padding:2px 0;font-weight:800;font-size:12px;color:var(--ink2)}
.ladder div svg{width:20px;height:20px}
.ladder div.on{background:var(--lane);color:#26231d}
.alt{font-size:12px;color:var(--ink2);margin-top:4px}

/* panels: intro, end, trip log */
.panel{position:fixed;z-index:4;background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);overflow:auto;box-shadow:0 8px 24px rgba(60,40,10,.25);padding:18px 20px}
.side{left:0;top:0;bottom:0;width:min(440px,100%);border-radius:0 12px 12px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:32px;flex:none}
.brand h1{font-size:22px;font-weight:900}
.brand .tag{color:var(--ink2);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:5px 12px;min-height:34px;font-size:13px;font-weight:800;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
.shield{display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px}
.roadname{font-family:Bitter,Georgia,serif;font-size:28px;font-weight:700;line-height:1.1;margin:4px 0 4px}
.lede{color:var(--ink2)}
.zoo{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.zoo span{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;color:var(--ink2)}
.zoo svg{width:24px;height:24px}
.big{font-family:Bitter,Georgia,serif;font-size:72px;font-weight:700;line-height:1;margin:8px 0 0;font-variant-numeric:tabular-nums}
.big small{font-family:Overpass,sans-serif;font-size:22px;font-weight:800;margin-left:6px}
.streak{color:var(--ink2);font-size:14px;margin-top:4px}
.res{list-style:none;padding:0;margin:12px 0;display:grid;gap:4px}
.res li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;background:var(--panel2);border-radius:6px;font-size:14px}
.res li small{display:block;color:var(--ink2);font-size:12px}
.res li b{font-variant-numeric:tabular-nums}
.res svg{width:28px;height:28px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
pre.share{background:var(--panel2);padding:10px;border-radius:6px;white-space:pre-wrap;font:13px/1.4 Overpass,sans-serif;margin:8px 0 0}
.foot{color:var(--ink2);font-size:12px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.stats div{background:var(--panel2);border-radius:6px;padding:8px 10px}
.stats b{display:block;font-size:22px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
.stats small{color:var(--ink2);font-size:12px}
.log h3{font-size:13px;font-weight:800;margin:14px 0 4px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.trips li{grid-template-columns:minmax(0,1fr) auto}
.souv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.souv span{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.souv svg{width:22px;height:22px}
.hero{position:fixed;left:0;right:0;top:0;text-align:center;padding:5vh 16px 0;z-index:4;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 30px rgba(0,0,0,.6)}
.hero .ttl{font-family:Bitter,Georgia,serif;font-weight:700;font-size:clamp(52px,9vw,104px);line-height:1;letter-spacing:-.01em}
.hero .sub{color:#6fd39c;font-weight:900;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(12px,1.6vw,16px);margin-top:6px}
.hero .meta{margin-top:14px;font-size:clamp(14px,1.6vw,17px)}
.hero .today{font-weight:800;font-size:clamp(14px,1.6vw,17px);margin-top:4px}
.bar.home{flex-direction:column;align-items:stretch;gap:6px;padding:12px 14px 10px;width:min(560px,calc(100% - 24px))}
.how{text-align:center}
.how summary{cursor:pointer;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--ink2);padding:4px}
.how p{text-align:left;color:var(--ink2);font-size:14px;margin-top:4px}
.how .zoo{justify-content:center}
.about p{font-size:15px;line-height:1.5;margin:8px 0}
.about a{color:inherit}
.about h3{font-size:13px;font-weight:800;margin:18px 0 4px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.about .sig{color:var(--ink2);font-size:14px;font-style:italic}
.qa{border-top:1px solid var(--line);padding:2px 0}
.qa summary{cursor:pointer;font-weight:800;font-size:15px;padding:9px 0;list-style-position:outside}
.qa div{padding:0 0 8px}
.qa .zoo{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.qa .zoo span{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700}

/* home panel: floating card on the left (desktop), short bottom sheet (mobile) */
.panel.homep{top:20px;left:20px;bottom:auto;width:340px;border-radius:12px;padding:16px 18px 12px}
.homep .hp-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.homep .ttl{font-family:Bitter,Georgia,serif;font-weight:700;font-size:34px;line-height:1;margin:0}
.homep .hp-road{font-size:19px;margin:10px 0 0;display:flex;align-items:center}
.homep .hp-from{color:var(--ink2);font-size:14px;margin:2px 0 10px}
.homep .how{margin-top:4px}
.homep .homefoot{justify-content:center;gap:0;padding-top:4px;margin-top:4px}
.homep .hp-credit{text-align:center;margin-top:4px;font-size:11px}

/* results header */
.pc-from{font-size:13px;color:var(--ink2);font-weight:700}
.pc-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.pc-row .big{margin:0}
.pc-signs{display:flex;gap:2px}
.pct{font-size:15px;font-weight:700;margin:10px 0 0}.pct small{color:var(--ink2);font-weight:600}
.tpick{display:flex;flex-direction:column;gap:3px;margin:8px 0 2px}.tpick select{font:inherit;font-size:14px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.testnote{background:#fff1b0;color:#5a4a12;border-radius:6px;padding:6px 10px;font-size:13px;margin-top:10px}
/* results */
.res-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.res-head .pct{font-size:15px;font-weight:700;margin:0 0 8px}
.res-head .pct small{color:var(--ink2);font-weight:600}
.sec{border-top:1px solid var(--line);margin-top:10px;padding-top:2px}
.sec>summary{cursor:pointer;font-weight:800;font-size:15px;padding:10px 0;display:flex;justify-content:space-between;align-items:center}
.sec>summary small{color:var(--ink2);font-weight:600;font-size:12px;margin-left:auto;margin-right:8px}
.sec>summary::after{content:'+';font-size:20px;color:var(--ink2);line-height:1}
.sec[open]>summary::after{content:'–'}
.sec>summary::-webkit-details-marker{display:none}
/* small stop markers when signs would collide */
.lbl.dot{width:12px;height:12px;padding:0;border-radius:50%;border-width:2px;outline:0;font-size:0;transform:translate(-50%,-50%)}
.lbl.dot *{display:none}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--ink2);font-weight:800;font-size:13px;cursor:pointer;padding:6px 8px;text-decoration:underline;text-underline-offset:3px}
.lnk[aria-pressed=false]{opacity:.7}
.hide{display:none!important}
@media(max-width:700px){
  .panel.homep{top:auto;left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;padding:12px 16px calc(8px + env(safe-area-inset-bottom))}
  .homep .ttl{font-size:28px}
  .homep .hp-road{font-size:17px;margin-top:6px}
  .homep .hp-from{margin-bottom:8px}
  .big{font-size:48px}
  .big small{font-size:17px}
  .side{top:auto;left:0;right:0;width:auto;bottom:0;max-height:58%;border-radius:14px 14px 0 0}
  .card{top:56px;padding:12px 14px}
  .odo{font-size:22px}
  .prog .slots i{width:17px;height:17px}
  .guide{font-size:13px;padding:2px 7px}
  .rv .xing{width:40px;height:40px}
  .ladder div{flex-direction:column;gap:0}
  .ladder div svg{width:18px;height:18px}
  .bar input{font-size:16px;min-height:42px}
  .btn{min-height:42px;padding:0 12px}
  .ring{width:40px;height:40px}
}
@media(prefers-reduced-motion:reduce){.car.riding .ride{animation:none}.pin.new{animation:none}}
</style>
</head>
<body>
<svg id="map" aria-hidden="true" preserveAspectRatio="none"></svg>
<div id="folds"></div><div id="pins" aria-hidden="true"></div>
<div class="top hide" id="top"><div class="odo"><span id="odo">0</span><small>MILES</small></div><div class="prog"><div class="slots" id="slots"></div><span id="qn"></span></div><div class="guide" id="guide"></div></div>
<header class="hero hide" id="hero"></header>
<main class="card" id="card" aria-live="polite"></main>
<div class="bar" id="bar"></div>
<div class="msg" id="msg" role="status"></div>
<aside class="panel side hide" id="panel" aria-live="polite"></aside>
<script>
{
const P=[
{id:'states',q:'Name a US state',list:`California|Texas|New York|Florida|Hawaii|Alaska|Washington|Ohio|Georgia|Michigan|Illinois|Arizona|Colorado|Nevada|Pennsylvania|Massachusetts|Oregon|New Jersey|Virginia|North Carolina|Tennessee|Louisiana|Utah|Kentucky|Montana|Minnesota|Wisconsin|Alabama|Mississippi|Missouri|Kansas|Oklahoma|Indiana|Iowa|South Carolina|Maine|Vermont|New Mexico|Connecticut|Maryland|Arkansas|Idaho|Nebraska|Wyoming|West Virginia|New Hampshire|Rhode Island|Delaware|South Dakota|North Dakota`,traps:{'washington dc':'DC isn’t a state (yet).','district of columbia':'DC isn’t a state (yet).','puerto rico':'A territory, not a state.'}},
{id:'mstates',q:'Name a state beginning with M',list:`Michigan|Massachusetts|Montana|Minnesota|Mississippi|Missouri|Maryland|Maine`},
{id:'twoword',q:'Name a state with a two-word name',list:`New York|New Jersey|North Carolina|South Carolina|New Mexico|West Virginia|North Dakota|South Dakota|New Hampshire|Rhode Island`},
{id:'atlantic',q:'Name a state with an Atlantic coastline',list:`Florida|New York|Maine|Massachusetts|North Carolina|New Jersey|South Carolina|Georgia|Virginia|Maryland|Connecticut|Rhode Island|Delaware|New Hampshire`,traps:{pennsylvania:'So close: Pennsylvania only reaches the Delaware River estuary, not the ocean.',vermont:'Vermont is landlocked.','washington dc':'DC is on the Potomac, not the coast.'}},

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/['’`.]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|jr|sr)\b/g,' ').replace(/\bst\b/g,'saint').replace(/\bmt\b/g,'mount').replace(/\s+/g,' ').trim();
function prep(p){
  if(p.ready)return p;
  const items=p.bank
    ?p.bank.map(([name,al,tier],i)=>({name,al:[name,...al].map(norm).filter(Boolean),rank:i,tier}))
    :p.list.split('|').map((e,i)=>{const [name,al]=e.split('=');return {name:name.trim(),al:[name,...(al?al.split(';'):[])].map(norm),rank:i}});
  if(p.people){const seen=new Set();for(const it of items){const last=it.al[0].split(' ').pop();if(last.length>2&&!seen.has(last)){it.al.push(last);seen.add(last)}else seen.add(last)}}
  const n=items.length;
  if(!p.bank)items.forEach(it=>{const q=it.rank/n;it.tier=CUTS.findIndex(c=>q<c)});
  // every prompt must have 100-mile answers: stretch the tiers so the rarest ones reach the top
  const mx=Math.max(...items.map(it=>it.tier));p.mx=mx>0&&mx<5?mx:5;if(p.mx<5)items.forEach(it=>{it.tier=Math.round(it.tier*5/p.mx)});
  p.items=items;p.trapMap=Object.fromEntries(Object.entries(p.traps||{}).map(([k,v])=>[norm(k),v]));p.ready=true;return p;
}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return d[b.length]}
function judge(p,raw){
  let s=norm(raw);if(!s)return null;
  for(const w of (p.strip||[]).map(norm))s=s.replace(new RegExp('\\b'+w+'\\b','g'),' ').replace(/\s+/g,' ').trim();
  if(p.trapMap[s])return {trap:p.trapMap[s]};
  let best=null,score=0;
  for(const it of p.items)for(const a of it.al){
    let sc=0;if(s===a)sc=1000+a.length;else if(a.length>=4&&(' '+s+' ').includes(' '+a+' '))sc=a.length;
    if(sc>score){score=sc;best=it}}
  if(best)return {it:best};
  let bd=9;for(const it of p.items)for(const a of it.al){const lim=a.length>=9?2:a.length>=5?1:0;const d=lev(s,a);if(d<=lim&&d<bd){bd=d;best=it}}
  return best?{it:best,fuzzy:true}:{miss:true};
}

// Each day's seven prompts are picked from the least recently used ones, so a prompt
// comes back only after every other prompt has had a turn (about every 4-5 days).
// At most 2 per category and 1 from the "states" family a day. Days 1-2 keep what was

// Last resort for an answer missing from the list and from Wikidata: search English Wikipedia (open, no key, CORS ok)
// and accept the top hit when its title is the answer and its description or categories say it is the right kind of thing.
const US_RE=/\b(american|united states|u\.s\.|usa|alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|georgia \(u\.s\. state\)|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new hampshire|new jersey|new mexico|new york|north carolina|north dakota|ohio|oklahoma|oregon|pennsylvania|rhode island|south carolina|south dakota|tennessee|texas|utah|vermont|virginia|washington \(state\)|washington, d\.c\.|west virginia|wisconsin|wyoming|seattle|portland|chicago|los angeles|san francisco|san diego|denver|boston|atlanta|houston|dallas|milwaukee|st\. louis|detroit|philadelphia|brooklyn|nashville|new orleans|miami|minneapolis|pittsburgh|cleveland|cincinnati|baltimore|phoenix|austin|san antonio|honolulu|las vegas|salt lake city|kansas city|hershey|memphis|louisville|omaha|tulsa)\b/i;

  beer:{kw:'brewery',d:/\b(brewery|brewing|brewpub|beer|lager|ale|stout|pilsner|ipa)\b/i,c:/\b(breweries|brewing companies|beer brands)\b/i,us:1},
  soda:{kw:'soft drink',d:/\b(soft drink|soda|cola|root beer|ginger ale|cream soda|carbonated)\b/i,c:/\b(soft drinks|cola brands|carbonated drinks|drink (companies|brands))\b/i,us:1},
  cereal:{kw:'cereal',d:/\bcereal\b/i,c:/\bbreakfast cereals\b/i,us:1},
  candy:{kw:'candy',d:/\b(candy|chocolate|confection|confectionery|lollipop|licorice|taffy|toffee|chewing gum|jelly bean)\b/i,c:/\b(candy|confectionery|chocolate bars|brand name confectionery)\b/i,us:1},
  fastfood:{kw:'restaurant chain',d:/\b(fast[- ]food|restaurant chain|chain of restaurants|drive-in|quick[- ]service|fast casual)\b/i,c:/\b(fast-food|fast food)\b/i,us:1},
  stores:{kw:'store',d:/\b(retailer|retail chain|department store|chain of [\w -]*stores|supermarket|grocery|discount store|pharmacy chain|convenience store)\b/i,c:/\b(retail companies|department stores|supermarkets|retailers|discount stores|convenience stores)\b/i,us:1},

  holidays:{kw:'holiday',d:/\b(holiday|observance|celebration|festival|commemoration|feast day|awareness (day|month)|day of (remembrance|observance))\b/i,c:/\b(public holidays in the united states|federal holidays in the united states|observances in the united states|holidays in the united states|american (holidays|observances))\b/i,us:1},
  firstladies:{kw:'First Lady',d:/\bfirst lady of the united states\b/i,c:/\bfirst ladies (and gentlemen )?of the united states\b/i},
};
const NOT_US=/\b(japanese|british|english|scottish|welsh|irish|dutch|german|canadian|mexican|belgian|french|italian|australian|swiss|chinese|korean|swedish|danish|norwegian|indian|brazilian|spanish|czech|austrian|new zealand)\b/i;
async function wikiCheck(p,raw,fetchFn){
  const W=WIKI[p.id];if(!W)return null;fetchFn=fetchFn||fetch;
  const q=raw.trim(),want=norm(q);if(want.length<3)return null;
  const ctl=typeof AbortController!=='undefined'?new AbortController():null,to=ctl&&setTimeout(()=>ctl.abort(),7000);
  const api=x=>fetchFn('https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=description%7Ccategories&cllimit=max&clshow=!hidden&'+x,ctl?{signal:ctl.signal}:{}).then(r=>r.json());
  const cats=pg=>(pg.categories||[]).map(c=>c.title.replace(/^Category:/,''));
  // right kind of thing, and American where the prompt needs it
  const fits=(pg,pool)=>{const d=pg.description||'',cs=cats(pg);
    if(!(W.d.test(d)||cs.some(c=>W.c.test(c))))return false;
    if(!W.us)return true;
    if(US_RE.test(d))return true;
    if(NOT_US.test(d))return false;
    if(cs.some(c=>(W.c.test(c)||W.d.test(c))&&US_RE.test(c)))return true;
    // "Annabelle Candy Company brands" → is Annabelle Candy Company American?
    const owners=cs.map(c=>(c.match(/^(.+) brands$/)||[])[1]).filter(Boolean);
    return pool.some(o=>owners.includes(o.title)&&US_RE.test(o.description||''));};
  const strip=t=>t.replace(/\s*\(.*?\)\s*/g,' ').trim();
  try{
    // 1. the answer as an exact page title (also follows redirects, e.g. a character that redirects to a list)
    const tc=q.replace(/\b\w/g,c=>c.toUpperCase());

      if(fits(pg,lp)){const r=red.find(x=>x.to===pg.title);LAST_TITLE=pg.title;return r&&!norm(strip(pg.title)).includes(want)?r.from:strip(pg.title)}

    }

    //    only when the bare answer isn't a page about something else

        if(!exact&&(exactFail||!nt.startsWith(want+' ')))continue;

      }
    }

  }catch(e){return null}finally{to&&clearTimeout(to)}
}
// Score an answer found live the same way the weekly build scores listed ones: by its Wikipedia page views,
// placed on this prompt's own scale (p.cut = the page-view floor of each tier, from data/bank.js).
// Returns a tier, or null when the page is so little read that it's more likely a loose match than an answer.
let LAST_TITLE=null;const OBSCURE=1;   // median daily views below this: not accepted, logged for review
async function liveTier(p,title,fetchFn){
  fetchFn=fetchFn||fetch;const fall=4;   // no page views to go on: 80 mi
  try{const j=await (await fetchFn('https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageviews&pvipdays=60&titles='+encodeURIComponent(title))).json();
    const pg=((j.query&&j.query.pages)||[])[0],pv=pg&&pg.pageviews;if(!pv)return fall;
    const d=Object.values(pv).map(v=>v||0).sort((a,b)=>a-b),med=d.length?d[d.length>>1]:0;
    if(med<OBSCURE)return null;
    if(!p.cut)return 4;
    const v=med*730,t=p.cut.findIndex(c=>v>=c),raw=t<0?5:t;
    return Math.min(5,Math.round(raw*5/(p.mx||5)));
  }catch(e){return fall}}
// ---------- end wikipedia check ----------
// ---------- live check ----------
// An answer missing from the list is looked up on Wikidata and accepted (at 100 mi) if it is the right kind of thing.
async function liveCheck(p,raw){
  const q=raw.trim(),tries=[q];if(p.strip&&p.strip.length&&!norm(q).includes(norm(p.strip[0])))tries.push(q+' '+p.strip[0]);
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),5000);
  try{
    const ids=new Set();
    for(const t of tries){const j=await (await fetch('https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&language=en&uselang=en&type=item&limit=7&search='+encodeURIComponent(t),{signal:ctl.signal})).json();
      const want=norm(t);for(const h of j.search||[]){const mt=norm((h.match&&h.match.text)||h.label||'');if(mt===want||lev(mt,want)<=1||mt.startsWith(want+' '))ids.add(h.id)}}
    if(!ids.size)return null;
    const sq=`SELECT ?item ?itemLabel ?article WHERE { VALUES ?item { ${[...ids].map(i=>'wd:'+i).join(' ')} } ${p.live} OPTIONAL { ?article schema:about ?item; schema:isPartOf <https://en.wikipedia.org/>. } SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } LIMIT 1`;
    const j=await (await fetch('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(sq),{signal:ctl.signal,headers:{Accept:'application/sparql-results+json'}})).json();

   <li>${sign(-1,28)}<div><span>${esc(C('results.nonanswer','Most-tried non-answer'))}</span><small>${esc(C('results.not_yet','Shows up once enough people have played'))}</small></div><b></b></li></ul></details>

   <div class="stats"><div><b>${G.mode==='daily'&&!G.test?tl.streak:'–'}</b><small>day streak</small></div><div><b>${tl.longest}</b><small>best streak</small></div><div><b>${tl.days}</b><small>daily drives</small></div></div>
   <h3 class="kicker" style="display:flex;justify-content:space-between">Recent drives <span style="letter-spacing:0;text-transform:none">Higher is rarer</span></h3>${logSVG()}</details>
  <details class="sec"><summary>${esc(C('results.wildlife','The wildlife'))}</summary>
   <ul class="res">${ZOO.map((z,k)=>`<li>${sign(k,28)}<div>${z.name}<small>${ODDS[k]}</small></div><b>${z.pts} mi</b></li>`).join('')}</ul></details>
  <div class="row" style="margin-top:14px">${EXTRAS||G.mode!=='daily'?`<button class="btn wide" id="again">${G.mode==='daily'?'Play Unlimited':'Drive again'}</button>`:''}<button class="btn" id="lg">Trip log</button>${TEST?`<button class="btn" data-replay>${esc(C('home.test_replay','Test: replay'))}</button>`:''}</div>
  <pre class="share hide" id="sh"></pre>
  <p class="streak" style="margin-top:16px">${md(C('results.suggest_lead','Know a question with loads of answers?'))}</p>
  <div class="row"><a class="btn wide" style="display:flex;align-items:center;justify-content:space-between;text-decoration:none" href="https://github.com/acotgreave/backroads/issues/new?title=Question%20idea%3A%20" target="_blank" rel="noopener">${esc(C('results.suggest','Suggest a question'))} <span>→</span></a></div>
  ${chips()}${credit}`;
  panel.querySelector('.pc-road').textContent=T.name;panel.querySelector('.pc-from').textContent=`${T.from} to ${T.to}`;
  panel.querySelector('.fl').textContent=at[1];panel.querySelector('.fln').textContent=mi>=700?C('results.whole_road','You drove the whole road.'):C('results.furthest','Furthest landmark. {next} was {left} miles further on.',{next:nx[1],left:nx[0]-mi});
  const stopNames=()=>panel.querySelectorAll('.sn').forEach(t=>t.textContent=T.stops[+t.dataset.i][1].split(/[ ,]/)[0]);stopNames();
  const bi=pop.reduce((b,x,i)=>ps[i].items.length>ps[b].items.length?i:b,0);panel.querySelector('.popa').textContent=`“${pop[bi].name}” · ${ps[bi].q}`;
  const A=$('answers');
  G.ans.forEach((a,i)=>{const p=ps[i],w=weights(p),it=p.items.find(x=>x.name===a.a);
    const d=document.createElement('div');d.style.cssText='padding:10px 0;border-top:1px solid var(--line)';
    d.innerHTML=`<div class="q" style="font-size:19px"></div><div style="display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:6px">${sign(a.tier,36)}<div><b class="an"></b><small style="display:block;color:#6fd39c" class="est"></small></div><b style="font-size:17px">+${a.pts} mi</b></div>
      <details style="margin-top:6px"><summary style="cursor:pointer;color:var(--ink2);font-size:13px;text-decoration:underline">See all ${p.items.length} answers</summary><div class="all" style="font-size:13px;color:var(--ink2);margin-top:6px"></div></details>`;
    d.querySelector('.q').textContent=p.q;d.querySelector('.an').textContent=a.a||'No answer';
    d.querySelector('.est').dataset.i=i;d.querySelector('.est').textContent=it?`About ${Math.max(1,Math.round(w[it.tier]*86))}% of players would say this (estimate)`:'';
    const all=d.querySelector('.all');
    for(let t=0;t<6;t++){const names=p.items.filter(x=>x.tier===t).map(x=>x.name).sort();if(!names.length)continue;
      const row=document.createElement('p');row.style.margin='4px 0';const b=document.createElement('b');b.style.color='var(--ink)';b.textContent=ZOO[t].pts+' mi: ';row.append(b,names.join(', '));all.append(row)}
    A.append(d)});
  $('sh').textContent=share;
  $('cp').onclick=async e=>{try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({text:share});return}await navigator.clipboard.writeText(share);e.target.textContent=C('results.copied','Copied')}catch(_){e.target.textContent=C('results.copy_fallback','Select the text below to copy');show($('sh'),true)}};
  if($('again'))$('again').onclick=()=>setMode('free');$('lg').onclick=tripLog;wireChips(panel);fillSrc(panel);
  const cd=()=>{const s=Math.max(0,Math.round((mid-new Date())/1000)),el=$('cdl');if(!el)return;el.innerHTML=md(C('results.next_drive','Next daily drive in **{time}**.',{time:`${Math.floor(s/3600)}h ${String(Math.floor(s/60)%60).padStart(2,'0')}m`}));setTimeout(cd,30000)};cd();
  panel.scrollTop=0;cam('over',calm?0:1200);
  if(G.mode==='daily'&&!G.test){const g=G;crowdSync(G.date).then(S=>{if(G===g&&S&&$('said'))applyCrowd(S,mi,T,ps,stopNames)})}
}
// swap the estimates on the results page for today's real numbers
function applyCrowd(S,mi,T,ps,stopNames){
  const N=S.players,cnt=n=>n===1?C('results.crowd_one','1 driver'):C('results.crowd_many','{n} drivers',{n:n.toLocaleString('en-US')});
  if(N<CROWD_MIN){$('cmpn').textContent=C('results.crowd_few','{drivers} so far today. Real numbers show up at {min}.',{drivers:cnt(N),min:CROWD_MIN});return}
  $('cmpn').textContent=C('results.crowd_today','{drivers} today',{drivers:cnt(N)});
  // where you rank among everyone else today
  let below=0,same=0;for(const [m,n] of S.miles){if(m<mi)below+=n;else if(m===mi)same+=n}
  const pct=Math.round((below+Math.max(0,same-1)/2)/Math.max(1,N-1)*100);
  $('pct').innerHTML=md(C('results.crowd_percentile','Further than **{pct}%** of today\'s {drivers}',{pct,drivers:cnt(N)}));
  const all=[];for(const [m,n] of S.miles)for(let k=0;k<n;k++)all.push(m);
  $('curve').innerHTML=curveSVG(all,mi,T.stops,"Spread of today's scores");stopNames();
  // what players said: only answers that are on today's lists, so nothing odd can be shown
  const said=[],miss=[];
  ps.forEach(p=>{const x=S.prompts[p.id];if(!x||x.players<CROWD_MIN)return;
    for(const [a,t,n] of x.answers){const it=p.items.find(i=>i.name===a);if(it)said.push({p,a,t:it.tier,n,share:n/Math.max(1,x.players)})}
    for(const [g,n] of x.misses)miss.push({p,g,n})});
  const li=[...$('said').children],put=(el,sg,name,q,note,right)=>{el.firstElementChild.outerHTML=sign(sg,28);
    const sp=el.querySelector('span');sp.textContent=name?`“${name}” · ${q}`:sp.textContent;el.querySelector('small').textContent=note;el.querySelector('b').textContent=right||''};
  if(said.length){const top=said.reduce((b,x)=>x.share>b.share||x.share===b.share&&x.n>b.n?x:b);
    put(li[0],top.t,top.a,top.p.q,C('results.popular_crowd','Most popular answer today'),Math.round(top.share*100)+'%');
    const rare=said.reduce((b,x)=>x.n<b.n||x.n===b.n&&x.t>b.t?x:b);
    put(li[1],rare.t,rare.a,rare.p.q,C('results.rarest_crowd','Rarest sighting · spotted by {drivers}',{drivers:cnt(rare.n)}),ZOO[rare.t].pts+' mi')}
  if(miss.length){const m=miss.reduce((b,x)=>x.n>b.n?x:b);
    put(li[2],-1,m.g,m.p.q,C('results.nonanswer_crowd','Most-tried non-answer · {drivers} tried it',{drivers:cnt(m.n)}))}
  // under each of your answers: how many said the same
  panel.querySelectorAll('#answers .est').forEach(el=>{const a=G.ans[+el.dataset.i],x=a&&S.prompts[a.id];
    if(!a||!a.a||!x||x.players<CROWD_MIN)return;const r=x.answers.find(y=>y[0]===a.a),n=r?r[2]:1;
    el.textContent=n<=1?C('results.said_only','Nobody else said this today'):C('results.said_pct','{pct}% of today\'s drivers said this',{pct:Math.max(1,Math.round(n/x.players*100))})});
}
function about(){
  clearInterval(tick);panel.classList.remove('homep');
  show(topEl,false);show(hero,false);show(card,false);show(barEl,false);show(panel,true);
  const A=COPY.about||{},v={signs:`<div class="zoo">${ZOO.map((z,k)=>`<span>${sign(k,22)}${z.pts} mi</span>`).join('')}</div>`};
  const qa=(q,a,open)=>`<details class="qa"${open?' open':''}><summary>${esc(q)}</summary><div>${paras(a,v)}</div></details>`;
  panel.innerHTML=`<div class="brand">${LOGO}<div><h1>${esc(A.title||'About Backroads')}</h1><div class="tag">${esc(A.tagline||'')}</div></div></div>
  <div class="about">
  ${paras(A.intro||'')}
  <h3>${esc(A.why_title||'Why it exists')}</h3>
  ${paras(A.why||'')}
  ${A.signature?`<p class="sig">${md(A.signature)}</p>`:''}
  <h3>${esc(A.faq_title||'Questions people ask')}</h3>
  ${Object.entries(A.faq||{}).map(([q,a],i)=>qa(q,a,i===0)).join('')}
  <h3 id="privacy">${esc(A.privacy_title||'Privacy')}</h3>
  ${paras(A.privacy_intro||'')}
  ${Object.entries(A.privacy||{}).map(([q,a])=>qa(q,a)).join('')}
  </div>
  <div class="row" style="margin-top:14px"><button class="btn go wide" id="back">${esc(A.back||'Back to the road')}</button></div>`;
  $('back').onclick=start;panel.scrollTop=0;cam('over');
  if(location.hash==='#privacy')setTimeout(()=>{const p=$('privacy');if(p)p.scrollIntoView()},50);
}
function tripLog(){
  clearInterval(tick);panel.classList.remove('homep');const t=trips();
  const fmt=s=>new Date(s+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  show(topEl,false);show(hero,false);show(card,false);show(barEl,false);show(panel,true);
  panel.innerHTML=`<div class="brand">${LOGO}<div><h1>${esc(C('triplog.title','Trip log'))}</h1><div class="tag">${t.days} daily drive${t.days===1?'':'s'}</div></div></div>
  <div class="log">${t.days?`<div class="stats"><div><b>${t.streak}</b><small>day streak (best ${t.longest})</small></div><div><b>${t.best}</b><small>mi, furthest drive</small></div><div><b>${t.total.toLocaleString('en-US')}</b><small>total miles</small></div></div>
  <h3>Souvenirs</h3>${t.souv.length?`<div class="souv">${t.souv.slice(0,40).map(()=>'<span></span>').join('')}</div>`:'<p class="streak">Spot a black bear or bald eagle (80 or 100 mi) to pick up a souvenir.</p>'}
  <h3>Past trips</h3><ul class="res trips">${t.h.slice().reverse().slice(0,60).map(()=>`<li><div><span></span><small></small></div><b></b></li>`).join('')}</ul>`
  :`<p class="streak" style="margin:12px 0">${md(C('triplog.empty','No trips logged yet.'))}</p>`}</div>
  <div class="row"><button class="btn go wide" id="back">${esc(C('triplog.back','Back to the road'))}</button></div>`;
  panel.querySelectorAll('.souv span').forEach((el,i)=>{const s=t.souv[i];el.innerHTML=sign(s.t,22);el.append(s.a);el.title=s.q+' · '+fmt(s.date)});
  const rev=t.h.slice().reverse();
  panel.querySelectorAll('.trips li').forEach((li,i)=>{const x=rev[i];li.querySelector('span').textContent=(x.road||'Daily drive')+' · '+fmt(x.date);
    li.querySelector('small').textContent=x.tiers?x.tiers.map(k=>k<0?'⬛':EMO[k]).join(''):'';li.querySelector('b').textContent=x.mi+' mi'});
  $('back').onclick=start;panel.scrollTop=0;cam('over');
}
function start(){
  clearInterval(tick);
  const saved=mode==='daily'?store.get('day2',null):null;
  if(saved&&saved.date===today()&&saved.qs&&saved.road<ROADS.length){G=saved;shown=miles();buildMap();if(G.i>=7)end();else{cam('ride',0);ask()}return}
  G=newGame(mode==='daily'?'backroad-'+today():null);shown=0;buildMap();intro();
}
function setMode(m){mode=m;start()}
// keep the answer bar above the on-screen keyboard
if(window.visualViewport){const vv=visualViewport;
  const fit=()=>{const k=Math.max(0,innerHeight-vv.height-vv.offsetTop);const kb=k>60;
    barEl.style.bottom=kb?k+8+'px':'';msgEl.style.bottom=kb?k+70+'px':'';
    card.style.top=kb&&vv.offsetTop?vv.offsetTop+8+'px':'';document.body.classList.toggle('kb',kb)};
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);
  document.addEventListener('focusin',()=>{setTimeout(fit,50);setTimeout(fit,350)});document.addEventListener('focusout',()=>setTimeout(fit,100))}
if(/^#(about|privacy)$/.test(location.hash)){start();about()}else start();
if(API&&store.get('outbox',[]).length)setTimeout(()=>crowdSync(null),3000);
}
</script>
