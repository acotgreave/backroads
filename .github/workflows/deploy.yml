name: Build questions and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC: refresh Wikidata answers + page views
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write           # commit the refreshed data/bank.js
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Crowd results API: a Cloudflare Worker + D1 database (worker/). Skipped until the two Cloudflare
  # secrets are added; the site then keeps showing estimates. A failure here never blocks the site.
  worker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Cloudflare set up?
        id: on
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "on=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No Cloudflare secrets yet, so no crowd results: the site keeps its estimates."; fi

      - uses: actions/checkout@v5
        if: steps.on.outputs.on
      - uses: actions/setup-node@v4
        if: steps.on.outputs.on
        with:
          node-version: '22'
      - name: Install wrangler
        if: steps.on.outputs.on
        run: npm ci

      - name: Find or create the D1 database
        if: steps.on.outputs.on
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="backroads") | .uuid'; }
          id=$(find_id)
          if [ -z "$id" ]; then npx wrangler d1 create backroads; id=$(find_id); fi
          [ -n "$id" ] || { echo "::error::could not find or create the backroads D1 database"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml

      - name: Update the database tables
        if: steps.on.outputs.on
        run: npx wrangler d1 migrations apply backroads --remote

      - name: Deploy the worker
        if: steps.on.outputs.on
        run: |
          npx wrangler deploy
          # fresh salt for scrambling IP addresses in the rate limiter; never stored anywhere else
          openssl rand -hex 16 | npx wrangler secret put SALT

      - name: Worker address
        id: url
        if: always() && steps.on.outputs.on
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || { echo "::error::no workers.dev subdomain: open Workers & Pages in the Cloudflare dashboard once to pick one"; exit 1; }
          url="https://backroads-api.$sub.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Crowd API: $url"
          sleep 5; curl -sf "$url/api/health" || echo "::warning::$url/api/health did not answer yet"

  build:
    needs: worker
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read curated prompts from the game page
        run: node scripts/extract_curated.js

      - name: Check hand answers and aliases
        run: node scripts/check_answers.js --hand-only

      - name: Week number (cache key)
        id: wk
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4      # pushes in the same week reuse the API responses: polite to Wikimedia
        with:
          path: .cache
          key: wikidata-${{ steps.wk.outputs.week }}

      - name: Rebuild the answer bank from Wikidata + page views
        continue-on-error: true      # if Wikidata is down, the last committed bank is used
        run: python3 scripts/build_bank.py

      - name: Check the built bank (warnings only)
        continue-on-error: true
        run: node scripts/check_answers.js --warn-only

      - name: Keep the build report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-report
          path: |
            data/report.csv
            data/bank.js
          if-no-files-found: ignore

      - name: Commit refreshed bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bank.js data/report.csv data/curated.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh answer bank from Wikidata"
            git pull --rebase && git push
          elif [ "${{ github.event_name }}" = "schedule" ] && \
               [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "Keep scheduled refresh active"   # GitHub pauses schedules after 60 quiet days
            git pull --rebase && git push
          fi

      - name: Assemble site
        env:
          CROWD_API: ${{ needs.worker.outputs.url || vars.CROWD_API_URL }}
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
