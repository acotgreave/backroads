name: Check Wikipedia answer matching

# Runs the in-game Wikipedia check against live Wikipedia for known right and wrong answers.
on:
  push:
    branches-ignore: [main]
    paths: [src/template.html, scripts/check_wiki.js]
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check_wiki.js
