# Answer tests: the obvious answers each prompt MUST get right. Edit freely (on GitHub is fine).
# Every push runs these through the game's own matching code (scripts/check_answers.js).
#
#   accept: answers (and spellings) that must count. Separate with |. The build FAILS if one doesn't.
#   reject: answers that must NOT count (wrong country, wrong kind of thing). The build FAILS if one does.
#   common: answers everyone thinks of first. On the weekly answer bank they should score 40 mi or less;
#           any that score more are listed as warnings (and on the dashboard), because they make 100 mi too easy.

