about:
  title: About Backroads
  tagline: A daily drive through America, seven questions long
  intro: |
    Backroads is a daily trivia game about the United States. You get seven question. The less obvious the answer, the further you'll go.
  why_title: Why it exists
  why: |
    Backroads borrows is inspired by two games, [Krillion](https://krillion.io) and [Boreen](https://boreen.co.uk). I built it for my friend Aaron, an American living in Brill, a small village in England. Aaron plays Boreen, and he kept getting stuck on questions that assume you grew up in Britain. Backroads gives him the advantage.
  signature: Andy Cotgreave, [How To Speak Data](https://howtospeakdata.com)
  faq_title: Questions people ask
  # Each question is the name on the left; its answer is the indented text below it.
  # {signs} shows the row of mile-marker signs.
  faq:
    How does it play?: |
      Seven questions a day. Type an answer and press Go. Wrong guesses cost nothing, so keep trying until you land one or pass. You get 25 seconds a question.

      Every answer counts for something, and rarer ones go further. There are six wildlife sightings along the way:

      {signs}

      The best possible drive is 700 miles.
    When does a new drive start?: |
      At midnight where you are. Everyone gets the same seven prompts on the same road that day.
    Where does the road go?: |
      Sixteen classic American roads, from Route 66 and the Blue Ridge Parkway to the Road to Hana and the Seward Highway.
    Where do the answers come from?: |
      Most lists come from [Wikidata](https://www.wikidata.org), the free database behind Wikipedia, and are refreshed every week. A few are written by hand. For huge categories like beers, stores and rivers, if your answer isn't in the list, the game asks Wikidata on the spot. If it's not there either, it checks Wikipedia. If either one knows it, it counts as a deep cut and is worth the full 100 miles.
    How is rarity decided?: |
      Work In Progress. For now it's an educated guess. Each answer is ranked by how often its Wikipedia page was read over the last two years. Heavily read pages are the answers most people think of first. Once enough people are playing, real answers will replace the guess.
    Are the "players said" numbers real?: |
      Not yet. The percentages on the results screen, like "further than about 60% of drivers," are estimates worked out from page views. Each one is labeled as an estimate. Real counts are coming.
    Why didn't my answer count?: |
      It might not fit the prompt, the spelling might be too far off, or we simply missed it. Small typos are forgiven. If you think it should count, suggest it using the link below.
    Do I need to sign up?: |
      No. There are no accounts. Your streak, trip log and souvenirs live in this browser, so they won't follow you to another phone or computer, and clearing your browser's site data wipes them.
    What's a souvenir?: |
      Spot a black bear or a bald eagle (an 80 or 100 mile answer) and the sign goes into your trip log as a keepsake.
    Is it free?: |
      Yes. No ads, no paywall.
    Can I suggest a question?: |
      Please do. [Open a suggestion on GitHub](https://github.com/acotgreave/backroads/issues/new?title=Question%20idea%3A%20). The same link works for an answer you think should count.
    Why "Backroads"?: |
      Because the interesting stuff is never on the interstate.
  privacy_title: Privacy
  privacy_intro: Backroads needs nothing from you to play. No accounts, no ads, no analytics, no tracking cookies.
  privacy:
    What's kept on your device: |
      Your browser stores today's game, your trip history, streaks and souvenirs (in local storage, under names starting "backroad:"). None of it is sent to us. Clear this site's data in your browser and it's gone.
    What leaves your device: |
      **Live answer checks.** When you type an answer that isn't on our list, that answer, and only that, is sent to Wikidata and Wikipedia (both run by the Wikimedia Foundation) to look it up.

      **Fonts.** The lettering loads from Google Fonts, so Google sees your IP address when the page opens.

      **Hosting.** The site is served by GitHub Pages. GitHub may log visits for security, as any web host does.

      **Suggestions.** Suggesting a question opens GitHub, where your suggestion is public under your GitHub account.
    If this changes: |
      Real "what players said" counts will need answers to be sent to a server. When that arrives, this page will say exactly what is collected, before it starts.
  back: Back to the road
