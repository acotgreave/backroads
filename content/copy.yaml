# Backroads: the words on the site.
#
# Edit the text on the right of each colon, then commit. The site rebuilds and goes live in about 2 minutes.
# You can edit this file straight on GitHub: open it, click the pencil, change the text, then "Commit changes".
#
# Rules that keep it working:
# - Keep the names on the left (like "start:") exactly as they are, and keep the indenting (spaces, not tabs).
# - Words in {curly braces} are filled in by the game, such as {road} or {miles}. Keep them, but move them around freely.
# - Text after "|" can run over several lines. Leave a blank line to start a new paragraph.
# - **double stars** make text bold, and [words](https://example.com) makes a link.
# - If the build can't read this file, the site stays on the last version and the GitHub Actions run turns red.

